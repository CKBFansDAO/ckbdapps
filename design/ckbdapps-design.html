<title>CKBdapps Slot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;900&display=swap">
<style>
/* Layout concept: the logo is a bracket with a purple plug. That one shape is the system.
   It frames the headline word, becomes the search bar, the buttons, project avatars and every empty slot.
   Dark ink hero, one purple band, paper sections for reading. Left aligned, heavy and wide display type. */
:root {
  --page: #121218;
  --ink: #1c1c23;
  --purple: #733dff;
  --purple-hi: #9068ff;
  --purple-deep: #5a26e8;
  --paper: #f3f2f7;
  --paper-ink: #15151c;
  --white: #ffffff;
  --mut-d: #a3a2b3;
  --mut-p: #5d5c6b;
  --line-d: rgba(255, 255, 255, .14);
  --line-p: rgba(21, 21, 28, .16);
  --display: 'Archivo', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
  --body: 'Archivo', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --hh: 64px;
  color-scheme: dark;
}
.on-dark { --bg: var(--page); --fg: var(--white); --mut: var(--mut-d); --line: var(--line-d); --accent: var(--purple-hi); --surface: var(--ink); background: var(--bg); color: var(--fg); }
.on-paper { --bg: var(--paper); --fg: var(--paper-ink); --mut: var(--mut-p); --line: var(--line-p); --accent: var(--purple-deep); --surface: var(--white); background: var(--bg); color: var(--fg); }

* { box-sizing: border-box; }
body { background: var(--page); color: var(--white); font: 400 16px/1.55 var(--body); font-variation-settings: "wdth" 100; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--purple-hi); outline-offset: 3px; }
.on-paper :focus-visible { outline-color: var(--purple-deep); }
.in { max-width: 1240px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 48px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wide { font-family: var(--display); font-weight: 800; font-stretch: 125%; font-variation-settings: "wdth" 125; letter-spacing: -.03em; }
.semi { font-family: var(--display); font-weight: 800; font-variation-settings: "wdth" 112; letter-spacing: -.02em; }
html[lang="zh-CN"] .wide, html[lang="zh-CN"] .semi { letter-spacing: 0; font-weight: 900; }

/* The plug: bracket frame with a purple block. Used inline, on buttons, on empty slots. */
.inslot { --s: .1em; position: relative; display: inline-block; padding: .03em .26em .0em .2em; margin-right: .36em; border: var(--s) solid currentColor; border-right: 0; line-height: .95; }
.inslot::after { content: ""; position: absolute; right: -.3em; top: 0; bottom: 0; width: .3em; background: var(--purple); }
.btn { position: relative; display: inline-flex; align-items: center; gap: 10px; margin-right: 14px; padding: 9px 18px 9px 16px; border: 2px solid currentColor; border-right: 0; background: transparent; text-decoration: none; font-weight: 700; font-size: .9rem; white-space: nowrap; }
.btn::after { content: ""; position: absolute; right: -14px; top: 0; bottom: 0; width: 14px; background: var(--purple); transition: width .18s, right .18s; }
.btn:hover::after { width: 24px; right: -24px; }
.btn:hover { margin-right: 24px; }
.btn.big { padding: 14px 24px 14px 22px; font-size: 1rem; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: var(--hh); background: rgba(18, 18, 24, .86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line-d); }
.top .in { height: 100%; display: flex; align-items: center; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; font-size: 1.15rem; text-decoration: none; }
.brand img { display: block; width: 34px; height: 34px; border-radius: 8px; }
.top nav { display: flex; gap: 24px; margin-left: auto; }
.top nav button { background: none; border: 0; padding: 6px 0; color: var(--mut-d); font-weight: 600; font-size: .92rem; border-bottom: 2px solid transparent; }
.top nav button:hover, .top nav button[aria-current="page"] { color: var(--white); border-color: var(--purple-hi); }
.lang { display: inline-flex; border: 1px solid var(--line-d); }
.lang button { background: transparent; border: 0; padding: 10px 12px; min-height: 40px; font: 600 .78rem var(--mono); color: var(--mut-d); }
.lang button[aria-pressed="true"] { background: var(--white); color: var(--ink); }
@media (max-width: 760px) { .top nav { display: none; } .top .lang { margin-left: auto; } }
@media (max-width: 480px) { .top .btn { display: none; } }

/* Hero */
.hero { position: relative; overflow: hidden; padding-block: clamp(56px, 10vw, 128px) clamp(44px, 7vw, 88px); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero .in { position: relative; }
.kicker { margin: 0; color: var(--mut-d); font-weight: 600; font-size: 1rem; }
h1.mega { margin: 18px 0 0; max-width: 13ch; font-size: clamp(2.6rem, 8.4vw, 7.2rem); line-height: .94; text-wrap: balance; animation: rise .7s cubic-bezier(.2, .8, .2, 1) backwards; }
html[lang="zh-CN"] h1.mega { line-height: 1.08; max-width: 12em; }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } }

.slot-search { position: relative; margin-top: clamp(28px, 5vw, 56px); max-width: 880px; animation: rise .7s .12s cubic-bezier(.2, .8, .2, 1) backwards; }
.slot-bar { --s: 10px; display: flex; align-items: stretch; height: clamp(64px, 9vw, 92px); }
.slot-bar input { flex: 1; min-width: 0; padding-inline: clamp(16px, 3vw, 28px); background: rgba(18, 18, 24, .72); border: var(--s) solid var(--white); border-right: 0; border-radius: 0; font-weight: 700; font-size: clamp(1.05rem, 2.5vw, 1.7rem); color: var(--white); outline-offset: 6px; }
.slot-bar input::placeholder { color: var(--mut-d); opacity: 1; }
.slot-bar .plug { flex: none; width: clamp(60px, 8vw, 92px); margin-block: var(--s); border: 0; background: var(--purple); color: var(--white); font-weight: 800; font-size: 1.05rem; transition: width .18s, background .18s; }
.slot-bar .plug:hover, .slot-bar input:focus + .plug { background: var(--purple-hi); width: clamp(72px, 10vw, 120px); }
.suggest { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin: 8px 0 0; padding: 6px; list-style: none; background: var(--ink); border: 1px solid var(--line-d); box-shadow: 0 24px 60px rgba(0, 0, 0, .5); }
.suggest button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 12px; background: none; border: 0; text-align: left; }
.suggest button:hover, .suggest button[aria-selected="true"] { background: var(--purple); }
.suggest .ic { width: 28px; flex: none; color: var(--purple-hi); }
.suggest button:hover .ic, .suggest button[aria-selected="true"] .ic { color: var(--white); }
.suggest b { font-weight: 700; }
.suggest span.c { margin-left: auto; color: var(--mut-d); font-size: .82rem; }
.suggest button:hover span.c, .suggest button[aria-selected="true"] span.c { color: var(--white); }
.quick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 18px; color: var(--mut-d); font-size: .92rem; }
.quick button { padding: 5px 12px; background: transparent; border: 1px solid var(--line-d); font-weight: 600; font-size: .88rem; }
.quick button:hover { background: var(--white); color: var(--ink); border-color: var(--white); }
.stats { display: flex; flex-wrap: wrap; gap: 20px clamp(28px, 6vw, 72px); margin: clamp(36px, 6vw, 72px) 0 0; padding: 0; }
.stats div { display: flex; flex-direction: column-reverse; }
.stats dt { color: var(--mut-d); font-size: .95rem; font-weight: 600; }
.stats dd { margin: 0; font-size: clamp(2.2rem, 5vw, 3.8rem); line-height: 1; }

/* Marquee */
.band { overflow: hidden; background: var(--purple); color: var(--white); }
.track { display: flex; width: max-content; animation: marq 70s linear infinite; }
.band:hover .track { animation-play-state: paused; }
.run { display: flex; align-items: center; flex: none; }
.run button { display: inline-flex; align-items: baseline; gap: 8px; background: none; border: 0; padding: .28em 0; font-size: clamp(2.1rem, 5.4vw, 4.4rem); line-height: 1; text-transform: uppercase; color: var(--white); }
.run button sup { font: 600 .26em var(--mono); letter-spacing: 0; opacity: .8; }
.run button:hover { color: var(--ink); }
.run i { flex: none; width: .5em; height: .5em; margin-inline: clamp(18px, 3vw, 40px); background: var(--ink); font-size: clamp(2.1rem, 5.4vw, 4.4rem); }
@keyframes marq { to { transform: translateX(-50%); } }

/* Paper sections */
.sec { padding-block: clamp(48px, 8vw, 104px); }
.sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px 32px; margin-bottom: clamp(24px, 4vw, 44px); }
h2.h { margin: 0; font-size: clamp(2rem, 5.2vw, 4rem); line-height: 1; }
.sec-head p { margin: 0; max-width: 42ch; color: var(--mut); }
h3.sub { margin: clamp(32px, 5vw, 56px) 0 16px; font-size: 1.15rem; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 14px; }
.tile { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; min-width: 0; aspect-ratio: 4 / 4.6; padding: 20px; background: var(--ink); color: var(--white); text-align: left; text-decoration: none; border: 0; transition: background .18s; }
.tile .ic { width: 46%; color: var(--purple-hi); transition: color .18s; }
.tile h4 { margin: 0; font-size: clamp(1.35rem, 2.3vw, 1.9rem); line-height: 1; overflow-wrap: anywhere; }
.tile p { margin: 8px 0 0; color: var(--mut-d); font-size: .85rem; }
.tile:hover { background: var(--purple); }
.tile:hover .ic { color: var(--white); }
.tile:hover p { color: var(--white); }
.tile.alt { background: transparent; color: var(--fg); border: 2px solid var(--fg); }
.tile.alt .ic { color: var(--purple-deep); }
.tile.alt p { color: var(--mut-p); }
.tile.alt:hover { background: var(--purple); color: var(--white); border-color: var(--purple); }
.tile.alt:hover .ic, .tile.alt:hover p { color: var(--white); }

.grants { display: grid; grid-template-columns: minmax(0, 1.2fr) repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: clamp(32px, 5vw, 56px); }
@media (max-width: 820px) { .grants { grid-template-columns: 1fr; } }
.gcard { padding: 24px; background: var(--ink); color: var(--white); display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 190px; }
.gcard h3 { margin: 0; font-size: 1.15rem; color: var(--mut-d); font-weight: 700; }
.gcard .big { font-size: clamp(2rem, 4vw, 3rem); line-height: 1; }
.gcard small { display: block; margin-top: 8px; color: var(--mut-d); font-size: .9rem; }
.empty-slot { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 20px; min-height: 190px; margin-right: 36px; padding: 22px 20px 22px 24px; border: 8px solid var(--fg); border-right: 0; text-decoration: none; }
.empty-slot::after { content: ""; position: absolute; right: -36px; top: 0; bottom: 0; width: 36px; border: 2px dashed var(--purple-deep); transition: background .18s; }
.empty-slot:hover::after { background: var(--purple); border-style: solid; }
.empty-slot strong { font-size: 1.3rem; line-height: 1.1; }
.empty-slot span { color: var(--mut-p); font-size: .9rem; }

/* Map */
.map-row { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px 32px; padding-block: 26px; border-top: 1px solid var(--line-d); }
.map-row:last-child { border-bottom: 1px solid var(--line-d); }
@media (max-width: 760px) { .map-row { grid-template-columns: 1fr; } }
.map-row h3 { margin: 0; font-size: 1.5rem; line-height: 1.1; }
.map-row .n { margin: 6px 0 12px; color: var(--mut-d); font-size: .9rem; }
.linkbtn { background: none; border: 0; padding: 0; font-weight: 700; text-decoration: underline; text-decoration-color: var(--purple-hi); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.linkbtn:hover { text-decoration-color: currentColor; }
.cells { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.mc { width: 40px; height: 40px; padding: 0; display: grid; place-items: center; background: transparent; border: 1px solid rgba(255, 255, 255, .26); font: 600 .74rem var(--mono); transition: background .12s, color .12s; }
.mc.cm { border-color: var(--purple-hi); border-width: 2px; color: var(--purple-hi); }
.mc:hover { background: var(--purple); border-color: var(--purple); color: var(--white); }
@media (max-width: 520px) { .mc { width: 34px; height: 34px; font-size: .66rem; } }
.readout { min-height: 1.7em; margin-top: 18px; color: var(--mut-d); font-size: .95rem; }
.readout strong { color: var(--white); }


/* Footer */
.foot { overflow: hidden; padding-top: clamp(40px, 6vw, 72px); }
.foot .links { display: flex; flex-wrap: wrap; gap: 12px 28px; justify-content: space-between; align-items: center; padding-bottom: 28px; color: var(--mut-d); }
.foot .links a { color: var(--white); }
.giant { display: block; margin: 0; padding-bottom: 8px; font-size: clamp(3rem, 15.4vw, 13rem); line-height: .86; white-space: nowrap; color: transparent; -webkit-text-stroke: 1.5px rgba(255, 255, 255, .34); user-select: none; }

/* Explore */
.ex-top { padding-block: clamp(40px, 7vw, 88px) 12px; }
.ex-top h1 { margin: 0; font-size: clamp(2.6rem, 9vw, 7rem); line-height: .92; }
.ex-top .cnt { margin: 14px 0 0; color: var(--mut-p); font-weight: 600; }
.toolbar { position: sticky; top: calc(var(--hh) + env(safe-area-inset-top, 0px)); z-index: 30; background: var(--paper); border-block: 2px solid var(--paper-ink); }
.toolbar .in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px; }
.f-search { --s: 4px; display: flex; align-items: stretch; flex: 1 1 260px; min-width: 0; height: 46px; }
.f-search input { flex: 1; min-width: 0; padding-inline: 14px; border: var(--s) solid var(--paper-ink); border-right: 0; border-radius: 0; background: var(--white); color: var(--paper-ink); font-weight: 600; }
.f-search input::placeholder { color: var(--mut-p); opacity: 1; }
.f-search .pl { flex: none; width: 18px; margin-block: var(--s); background: var(--purple); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tabs button { padding: 8px 12px; background: none; border: 0; border-bottom: 3px solid transparent; font-weight: 700; font-size: .92rem; color: var(--mut-p); }
.tabs button b { margin-left: 5px; font: 500 .72rem var(--mono); }
.tabs button:hover { color: var(--paper-ink); }
.tabs button[aria-pressed="true"] { color: var(--paper-ink); border-bottom-color: var(--purple); }
.tg { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: .9rem; }
.tg input { width: 17px; height: 17px; margin: 0; accent-color: var(--purple-deep); }
.seg { display: inline-flex; border: 2px solid var(--paper-ink); margin-left: auto; }
.seg button { padding: 6px 12px; background: transparent; border: 0; font-weight: 700; font-size: .85rem; }
.seg button[aria-pressed="true"] { background: var(--paper-ink); color: var(--paper); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 18px 6px; }
.chip { padding: 5px 12px; background: transparent; border: 1.5px solid var(--line-p); font-weight: 600; font-size: .85rem; }
.chip:hover { border-color: var(--paper-ink); }
.chip[aria-pressed="true"] { background: var(--purple); border-color: var(--purple); color: var(--white); }

.list { margin: 12px 0 0; padding: 0; list-style: none; }
.row { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1.1fr) minmax(0, 1.9fr) 7.5rem; align-items: center; gap: 16px; padding: 14px 18px 14px 0; border-bottom: 1px solid var(--line-p); text-decoration: none; }
.row::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 0; background: var(--purple); transition: width .14s; }
.row:hover { background: var(--white); }
.row:hover::after { width: 12px; }
.row .ic { width: 38px; color: var(--paper-ink); }
.row:hover .ic { color: var(--purple-deep); }
.row .nm { display: flex; flex-direction: column; min-width: 0; }
.row .nm strong { font-size: 1.1rem; line-height: 1.2; overflow-wrap: anywhere; }
.row .nm span { color: var(--mut-p); font-size: .85rem; }
.row .cts { display: flex; flex-wrap: wrap; gap: 6px; }
.tagp { padding: 1px 8px; border: 1px solid var(--line-p); font-size: .8rem; font-weight: 600; color: var(--mut-p); }
.row .fl { justify-self: end; font-weight: 700; font-size: .82rem; color: var(--purple-deep); }
@media (max-width: 760px) { .row { grid-template-columns: 44px minmax(0, 1fr); } .row .cts, .row .fl { grid-column: 2; justify-self: start; } .row .fl { margin-top: -6px; } }
.list.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.list.grid .row { grid-template-columns: 1fr; align-content: start; gap: 18px; padding: 18px; background: var(--white); border: 0; min-height: 220px; }
.list.grid .row .ic { width: 64px; }
.list.grid .row .fl { justify-self: start; }
.list.grid .row:hover { background: var(--ink); color: var(--white); }
.list.grid .row:hover .nm span { color: var(--mut-d); }
.list.grid .row:hover .ic { color: var(--purple-hi); }
.list.grid .row:hover .tagp { color: var(--mut-d); border-color: var(--line-d); }
.list.grid .row:hover .fl { color: var(--purple-hi); }
.none { padding: 48px 0; color: var(--mut-p); font-size: 1.1rem; }
.more { display: block; margin: 28px 0 0; }

/* Detail */
.d-hero { padding-block: clamp(24px, 4vw, 40px) clamp(40px, 7vw, 88px); }
.back { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 6px 0; color: var(--mut-d); font-weight: 600; }
.back::before { content: ""; width: 10px; height: 18px; background: var(--purple); }
.back:hover { color: var(--white); }
.d-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px clamp(28px, 5vw, 64px); margin-top: clamp(20px, 4vw, 44px); align-items: start; }
@media (max-width: 720px) { .d-grid { grid-template-columns: 1fr; } }
.framed { position: relative; width: clamp(104px, 17vw, 190px); aspect-ratio: 1; margin-right: clamp(26px, 4vw, 44px); padding: clamp(10px, 1.8vw, 20px); border: clamp(9px, 1.6vw, 16px) solid var(--white); border-right: 0; }
.framed::after { content: ""; position: absolute; right: calc(-1 * clamp(26px, 4vw, 44px)); top: 0; bottom: 0; width: clamp(26px, 4vw, 44px); background: var(--purple); }
.framed .ic { width: 100%; color: var(--purple-hi); }
.d-hero h1 { margin: 0; font-size: clamp(2.4rem, 7.4vw, 6rem); line-height: .94; overflow-wrap: anywhere; }
.d-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.d-meta span { padding: 3px 11px; border: 1.5px solid var(--line-d); font-weight: 600; font-size: .88rem; }
.d-sum { margin: 22px 0 0; max-width: 60ch; font-size: clamp(1.05rem, 1.6vw, 1.3rem); line-height: 1.5; color: #e4e3ee; }
.d-act { display: flex; flex-wrap: wrap; gap: 14px 22px; margin-top: 28px; }
.d-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 40px clamp(28px, 5vw, 64px); align-items: start; }
@media (max-width: 960px) { .d-body { grid-template-columns: 1fr; } }
.hls { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 14px; }
.hl { padding: 22px; background: var(--ink); color: var(--white); }
.hl .ic { width: 38px; color: var(--purple-hi); }
.hl h4 { margin: 22px 0 8px; font-size: 1.25rem; line-height: 1.1; }
.hl p { margin: 0; color: var(--mut-d); font-size: .92rem; }
.faq details { border-bottom: 1px solid var(--line-p); padding-block: 16px; }
.faq details:first-of-type { border-top: 2px solid var(--paper-ink); }
.faq summary { display: flex; justify-content: space-between; gap: 16px; cursor: pointer; list-style: none; font-weight: 700; font-size: 1.1rem; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: ""; flex: none; width: 14px; height: 14px; margin-top: 5px; background: var(--paper-ink); transition: transform .2s, background .2s; }
.faq details[open] summary::after { background: var(--purple); transform: rotate(45deg); }
.faq p { margin: 12px 0 0; max-width: 62ch; color: var(--mut-p); }
.panel { padding: 22px; background: var(--ink); color: var(--white); margin-bottom: 14px; }
.panel h3 { margin: 0 0 14px; font-size: 1.1rem; }
.score { display: flex; align-items: baseline; gap: 10px; margin-bottom: 18px; }
.score strong { font-size: 3rem; line-height: 1; }
.score span { color: var(--mut-d); font-size: .92rem; }
.sig { margin-top: 16px; }
.sig h4 { margin: 0 0 8px; font-size: .95rem; }
.sig ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.sig li { display: flex; align-items: center; gap: 10px; color: var(--mut-d); font-size: .9rem; }
.sig li i { flex: none; width: 14px; height: 14px; border: 1.5px solid var(--mut-d); }
.sig li.on { color: var(--white); }

    if ((el = e.target.closest('[data-cat]'))) { go('explore', { cat: el.getAttribute('data-cat') }); return; }
    if ((el = e.target.closest('[data-group]'))) { go('explore', { group: el.getAttribute('data-group') }); return; }
    if (e.target.closest('#back')) { go('explore'); return; }
    if (e.target.closest('[data-halving]') || e.target.closest('#n-halving')) { go('halving'); return; }
    if (e.target.closest('#n-stats')) { go('stats'); return; }
    if ((el = e.target.closest('[data-dstate]'))) { S.dstate = el.getAttribute('data-dstate'); renderDetail(); return; }
    if (e.target.closest('#brand') || e.target.closest('#n-home')) { go('home'); return; }
    if (e.target.closest('#n-explore')) { go('explore'); return; }
    if (e.target.closest('#n-map') || false) {
      var id = 'map';
      if (S.view !== 'home') go('home', null, true);
      var sec = $(id); if (sec) window.scrollTo({ top: sec.getBoundingClientRect().top + window.scrollY - 64, behavior: 'auto' });
      return;
    }
    if ((el = e.target.closest('#tabs button'))) { S.f.group = el.getAttribute('data-g') || null; S.f.cat = null; S.f.shown = PAGE; renderExplore(); return; }
    if ((el = e.target.closest('#chips .chip'))) { var c = el.getAttribute('data-c'); S.f.cat = S.f.cat === c ? null : c; S.f.shown = PAGE; renderExplore(); return; }
    if (e.target.closest('#m-list')) { S.f.mode = 'list'; renderExplore(); return; }
    if (e.target.closest('#m-grid')) { S.f.mode = 'grid'; renderExplore(); return; }
    if (e.target.closest('#more')) { S.f.shown += PAGE; renderExplore(); return; }
    if (e.target.closest('#lang-en')) { S.lang = 'en'; show(); return; }
    if (e.target.closest('#lang-zh')) { S.lang = 'zh'; show(); return; }
  });
  $('fq').addEventListener('input', function (e) { S.f.q = e.target.value.trim().toLowerCase(); S.f.shown = PAGE; renderExplore(); });
  $('fcomm').addEventListener('change', function (e) { S.f.comm = e.target.checked; S.f.shown = PAGE; renderExplore(); });
  $('maprows').addEventListener('mouseover', function (e) {
    var b = e.target.closest('.mc'); if (!b) return;
    var it = bySlug[b.getAttribute('data-slug')];
    $('readout').innerHTML = '<strong>' + esc(it.name) + '</strong> ' + esc(tagsOf(it).join(', '));
  });
  $('maprows').addEventListener('mouseleave', function () { $('readout').textContent = t('map_idle'); });

  /* ---------- Hero search ---------- */
  var PH = ['UTXOSwap', 'JoyID', 'Nervape', 'Omiga', 'Fiber Network', 'Neuron'], phI = 0, sel = -1, matches = [];
  setInterval(function () {
    var q = $('sq'); if (S.view !== 'home' || q.value || document.activeElement === q) return;
    phI++; q.placeholder = t('ph') + PH[phI % PH.length];
  }, 2600);
  function renderSuggest() {
    var v = $('sq').value.trim().toLowerCase(), box = $('sug');
    if (!v) { box.hidden = true; matches = []; sel = -1; return; }
    matches = items.filter(function (it) { return it.hay.indexOf(v) > -1; }).sort(function (a, b) {
      return (b.name.toLowerCase().indexOf(v) === 0) - (a.name.toLowerCase().indexOf(v) === 0) || a.name.localeCompare(b.name);
    }).slice(0, 6);
    sel = -1;
    box.innerHTML = matches.map(function (it, i) {
      return '<li role="option"><button type="button" data-i="' + i + '" aria-selected="false">' + icon(it.slug) + '<b>' + esc(it.name) + '</b><span class="c">' + esc(tagsOf(it)[0]) + '</span></button></li>';
    }).join('');
    box.hidden = matches.length === 0;
  }
  $('sq').addEventListener('input', renderSuggest);
  $('sq').addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { $('sug').hidden = true; return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!matches.length) return; e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + matches.length) % matches.length;
      Array.prototype.forEach.call($('sug').querySelectorAll('button'), function (b, i) { b.setAttribute('aria-selected', i === sel); });
    }
  });
  $('sug').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    $('sug').hidden = true; go('detail', matches[+b.getAttribute('data-i')].slug);
  });
  $('sform').addEventListener('submit', function (e) {
    e.preventDefault();
    if (sel > -1 && matches[sel]) { $('sug').hidden = true; go('detail', matches[sel].slug); return; }
    var q = $('sq').value.trim().toLowerCase(); $('sug').hidden = true;
    go('explore', { q: q });
  });
  document.addEventListener('pointerdown', function (e) { if (!e.target.closest('#sform')) $('sug').hidden = true; });

  /* ---------- Hero cell grid ---------- */
  var gridOn = false, raf = 0, G = {};
  function gridInit() {
    var cv = $('grid'), hero = $('hero'), ctx = cv.getContext('2d');
    var CS = 64, W = 0, H = 0, cols = 0, rows = 0, lit = new Float32Array(1), mx = -9999, my = -9999, rip = [], next = 0;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    function size() {
      var r = hero.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cols = Math.ceil(W / CS) + 1; rows = Math.ceil(H / CS) + 1; lit = new Float32Array(cols * rows);
      for (var k = 0; k < cols * rows * .05; k++) lit[(Math.random() * lit.length) | 0] = .5 + Math.random() * .4;
      draw(performance.now());
    }
    function rr(x, y, s) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, s, s, 8); else ctx.rect(x, y, s, s); }
    function draw(now) {
      ctx.clearRect(0, 0, W, H);
      var R = 240;
      for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
        var i = r * cols + c, x = c * CS + 3, y = r * CS + 3, s = CS - 6, cx = x + s / 2, cy = y + s / 2;
        var d = Math.hypot(cx - mx, cy - my), p = d < R ? 1 - d / R : 0, l = lit[i];
        for (var k = 0; k < rip.length; k++) {
          var rd = (now - rip[k].t) * .6, dd = Math.abs(Math.hypot(cx - rip[k].x, cy - rip[k].y) - rd);
          if (dd < CS && rd < 900) l = Math.max(l, .95 * (1 - dd / CS) * (1 - rd / 900));
        }
        rr(x, y, s); ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1; ctx.stroke();
        var a = Math.max(p, l);
        if (a > .02) {
          rr(x, y, s); ctx.fillStyle = 'rgba(115,61,255,' + (.34 * Math.max(p * p, l)).toFixed(3) + ')'; ctx.fill();
          ctx.strokeStyle = 'rgba(144,104,255,' + (.2 + .7 * a).toFixed(3) + ')'; ctx.lineWidth = 1.5; ctx.stroke();
        }
      }
    }
    function tick(ts) {
      if (!gridOn) { raf = 0; return; }
      if (ts > next) { lit[(Math.random() * lit.length) | 0] = 1; next = ts + 150; }
      for (var i = 0; i < lit.length; i++) lit[i] *= .975;
      rip = rip.filter(function (q) { return ts - q.t < 1500; });
      draw(ts); raf = requestAnimationFrame(tick);
    }
    hero.addEventListener('pointermove', function (e) { var b = hero.getBoundingClientRect(); mx = e.clientX - b.left; my = e.clientY - b.top; if (reduce) draw(performance.now()); });
    hero.addEventListener('pointerleave', function () { mx = my = -9999; if (reduce) draw(performance.now()); });
    hero.addEventListener('pointerdown', function (e) { if (reduce || e.target.closest('input,button,a,li')) return; var b = hero.getBoundingClientRect(); rip.push({ x: e.clientX - b.left, y: e.clientY - b.top, t: performance.now() }); });
    window.addEventListener('resize', function () { if (S.view === 'home') size(); });
    G.size = size; G.tick = tick; G.reduce = reduce;
    size();
  }
  function gridActive(on) {
    gridOn = on && !document.hidden;
    if (on && G.size) G.size();
    if (gridOn && !G.reduce && !raf && G.tick) raf = requestAnimationFrame(G.tick);
  }
  document.addEventListener('visibilitychange', function () { gridActive(S.view === 'home'); });

  gridInit();
  fromHash();
  show();
})();
</script>
