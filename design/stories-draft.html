<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builder Stories draft · CKBdapps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;900&display=swap">
<!-- Design draft: Builder Stories (index, story page, Home block, project-page badge, share card).
     A visual reference only, like ckbdapps-design.html and proofs-draft.html: not shipped, CSS not to be copied.
     Every person, project and story here is fictional. Requirements: design/ckbdapps Builder Stories 页需求说明.md -->
<style>
:root {
  --page: #121218; --ink: #1c1c23; --purple: #733dff; --purple-hi: #9068ff; --purple-deep: #5a26e8;
  --paper: #f3f2f7; --paper-ink: #15151c; --white: #fff; --mut-d: #a3a2b3; --mut-p: #5d5c6b;
  --line-d: rgba(255,255,255,.14); --line-p: rgba(21,21,28,.16);
  --display: 'Archivo', 'Noto Sans SC', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
}
.on-dark { --bg: var(--page); --fg: var(--white); --mut: var(--mut-d); --line: var(--line-d); --accent: var(--purple-hi); --surface: var(--ink); background: var(--bg); color: var(--fg); }
.on-paper { --bg: var(--paper); --fg: var(--paper-ink); --mut: var(--mut-p); --line: var(--line-p); --accent: var(--purple-deep); --surface: var(--white); background: var(--bg); color: var(--fg); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--white); font: 400 16px/1.55 var(--display); font-variation-settings: "wdth" 100; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--purple-hi); outline-offset: 3px; }
.on-paper :focus-visible { outline-color: var(--purple-deep); }
.in { max-width: 1240px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 48px); }
.wide { font-weight: 800; font-variation-settings: "wdth" 125; letter-spacing: -.03em; }
.semi { font-weight: 800; font-variation-settings: "wdth" 112; letter-spacing: -.02em; }
html[lang="zh-CN"] .wide, html[lang="zh-CN"] .semi { letter-spacing: 0; font-weight: 900; }
.inslot { position: relative; display: inline-block; padding: .03em .26em 0 .2em; margin-right: .36em; border: .1em solid currentColor; border-right: 0; line-height: .95; }
.inslot::after { content: ""; position: absolute; right: -.3em; top: 0; bottom: 0; width: .3em; background: var(--purple); }
.btn { position: relative; display: inline-flex; align-items: center; margin-right: 14px; padding: 9px 18px 9px 16px; border: 2px solid currentColor; border-right: 0; background: none; text-decoration: none; font-weight: 700; font-size: .9rem; white-space: nowrap; }
.btn::after { content: ""; position: absolute; right: -14px; top: -2px; bottom: -2px; width: 14px; background: var(--purple); transition: width .18s, right .18s; }
.btn:hover::after, .btn:focus-visible::after { width: 24px; right: -24px; }
.btn.lg { padding: 14px 24px 14px 20px; font-size: 1rem; }
.lnk { display: inline-flex; align-items: center; min-height: 40px; font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.mono { font-family: var(--mono); font-size: .82rem; font-weight: 500; }
.mut { color: var(--mut); }
[hidden] { display: none !important; }

/* Draft chrome */
.draft { margin: 0; background: var(--purple); color: var(--white); font: 600 .78rem/1.5 var(--mono); padding: 6px 0; }
.views { padding: 8px 0; background: var(--ink); border-bottom: 1px solid var(--line-d); font-size: .85rem; color: var(--mut-d); }
.views .in { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.views a { color: var(--white); font-weight: 700; text-decoration: none; padding: 6px 2px; border-bottom: 2px solid transparent; }
.views a[aria-current] { border-color: var(--purple-hi); }
.views .lang { margin-left: auto; display: inline-flex; border: 1px solid var(--line-d); }
.views .lang button { background: none; border: 0; padding: 6px 12px; min-height: 36px; font: 600 .78rem var(--mono); color: var(--mut-d); }
.views .lang button[aria-pressed="true"] { background: var(--white); color: var(--ink); }
.preview { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-block: 10px; font-size: .85rem; color: var(--mut-d); }
.preview button { border: 1px solid var(--line-d); background: none; padding: 6px 10px; min-height: 36px; font-weight: 600; font-size: .82rem; color: var(--white); }
.preview button[aria-pressed="true"] { background: var(--white); color: var(--ink); }
.ghost { border: 1px dashed var(--line); padding: 18px; color: var(--mut); font: 500 .85rem var(--mono); margin: 0; }
.draftsrc { background: var(--ink); color: var(--white); border-top: 4px solid var(--purple); }
.draftsrc summary { cursor: pointer; padding: 14px 0; font: 600 .82rem var(--mono); }
.draftsrc .cols { display: grid; gap: 20px; padding-bottom: 28px; }
@media (min-width: 900px) { .draftsrc .cols { grid-template-columns: 1fr 1fr; } }
.draftsrc h3 { margin: 0 0 8px; font: 600 .8rem var(--mono); color: var(--mut-d); }
.draftsrc pre { margin: 0; padding: 16px; background: var(--page); font: 500 .76rem/1.65 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 560px; overflow: auto; }

/* Site chrome */
.top { height: 64px; background: rgba(18,18,24,.92); border-bottom: 1px solid var(--line-d); }
.top .in { height: 100%; display: flex; align-items: center; gap: 24px; }
.brand { font-weight: 800; font-variation-settings: "wdth" 125; letter-spacing: .02em; text-decoration: none; }
.brand b { color: var(--purple-hi); }
.top nav { display: flex; gap: 22px; margin-left: auto; font-size: .92rem; font-weight: 600; }
.top nav a { color: var(--mut-d); text-decoration: none; padding: 6px 0; border-bottom: 2px solid transparent; }
.top nav a[aria-current] { color: var(--white); border-color: var(--purple-hi); }
@media (max-width: 1023px) { .top nav { display: none; } }
.foot { padding: clamp(32px, 5vw, 56px) 0; border-top: 1px solid var(--line-d); }
.foot .in { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 28px; color: var(--mut-d); }
.foot .links { display: flex; flex-wrap: wrap; gap: 6px 24px; }
.foot .links a { color: var(--white); }

/* Avatars: bracket + plug */
.framed { position: relative; flex: none; aspect-ratio: 1; border: 4px solid var(--fg); border-right: 0; padding: 3px; width: 44px; margin-right: 9px; }
.framed::after { content: ""; position: absolute; right: -9px; top: -4px; bottom: -4px; width: 9px; background: var(--purple); }
.framed svg { display: block; width: 100%; height: 100%; color: var(--accent); }
.framed.photo { padding: 0; }
.framed.sm { width: 36px; border-width: 3px; margin-right: 7px; }
.framed.sm::after { right: -7px; top: -3px; bottom: -3px; width: 7px; }
.framed.md { width: 64px; border-width: 5px; padding: 5px; margin-right: 13px; }
.framed.md.photo { padding: 0; }
.framed.md::after { right: -13px; top: -5px; bottom: -5px; width: 13px; }
.framed.lg { width: clamp(96px, 14vw, 168px); border-width: clamp(8px, 1.4vw, 14px); padding: clamp(8px, 1.4vw, 16px); margin-right: clamp(22px, 3.4vw, 38px); }
.framed.lg.photo { padding: 0; }
.framed.lg::after { right: calc(-1 * clamp(22px, 3.4vw, 38px)); width: clamp(22px, 3.4vw, 38px); top: calc(-1 * clamp(8px, 1.4vw, 14px)); bottom: calc(-1 * clamp(8px, 1.4vw, 14px)); }
.on-dark .framed { border-color: var(--white); }
.pill { display: inline-block; border: 1.5px solid var(--line); padding: 2px 10px; font-size: .84rem; font-weight: 600; }
.pill.net { border-color: var(--accent); color: var(--accent); }

/* Open slot (EmptySlot) */
.empty-slot { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 20px; min-height: 190px; margin-right: 36px; padding: 22px 20px 22px 24px; border: 8px solid var(--fg); border-right: 0; text-decoration: none; }
.empty-slot::after { content: ""; position: absolute; right: -36px; top: 0; bottom: 0; width: 36px; border: 2px dashed var(--accent); transition: background .18s; }
.empty-slot:hover::after, .empty-slot:focus-visible::after { background: var(--purple); border-style: solid; }
.empty-slot strong { font-size: 1.3rem; line-height: 1.1; }
.empty-slot span { color: var(--mut); font-size: .9rem; }

/* Stories index */
.s-hero { padding: clamp(40px, 7vw, 96px) 0 clamp(36px, 5vw, 64px); }
.s-hero h1 { margin: 0; font-size: clamp(2.5rem, 7.4vw, 6rem); line-height: .96; max-width: 14ch; }
html[lang="zh-CN"] .s-hero h1 { line-height: 1.12; }
.s-hero p { max-width: 58ch; margin: 24px 0 0; color: var(--mut); font-size: 1.15rem; }
.s-hero .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-top: 32px; }
.s-body { padding-block: clamp(32px, 5vw, 64px) clamp(56px, 8vw, 104px); }
.s-layout { display: grid; gap: 56px; }
@media (min-width: 1000px) { .s-layout { grid-template-columns: minmax(0, 1fr) 320px; gap: 64px; align-items: start; } .s-layout > aside { position: sticky; top: 24px; } }
.s-layout > * { min-width: 0; }
.date { margin: 0; color: var(--mut); }
.nm { font-weight: 700; }
.nm i { font-style: normal; color: var(--mut); font-weight: 600; margin: 0 .35em; }
.nm span { color: var(--mut); font-weight: 600; }
.latest { position: relative; display: grid; gap: 28px; padding-bottom: 48px; border-bottom: 2px solid var(--fg); }
@media (min-width: 721px) { .latest { grid-template-columns: auto minmax(0, 1fr); align-items: center; } }
.latest h2 { margin: 14px 0 0; font-size: clamp(2rem, 4.4vw, 3.5rem); line-height: .98; }
html[lang="zh-CN"] .latest h2 { line-height: 1.15; }
.latest h2 a { text-decoration: none; }
.latest h2 a::after { content: ""; position: absolute; inset: 0; }
.latest:hover h2 a, .latest h2 a:focus-visible { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: 6px; }
.latest .dek { margin: 16px 0 0; max-width: 54ch; font-size: clamp(1.05rem, 1.6vw, 1.25rem); }
.sub { margin: 52px 0 4px; font-size: 1.4rem; }
.past { list-style: none; margin: 0; padding: 0; }
.past a { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: start; padding: 22px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
.past .nm { display: block; font-size: .92rem; }
.past strong { display: block; margin-top: 4px; font-size: 1.35rem; line-height: 1.15; }
.past .dk { display: block; margin-top: 6px; color: var(--mut); max-width: 64ch; }
.past .date { display: block; margin-top: 8px; }
.past a:hover strong, .past a:focus-visible strong { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.s-main .empty-slot { margin-top: 48px; max-width: 600px; }
.empty-slot p { margin: 0; color: var(--mut); font-size: .95rem; max-width: 46ch; }
.empty-slot .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; }
.about { position: relative; padding: 22px 24px; margin-right: 14px; border: 2px solid var(--fg); border-right: 0; background: var(--surface); }
.about::after { content: ""; position: absolute; right: -14px; top: -2px; bottom: -2px; width: 14px; background: var(--purple); }
.about h2 { margin: 0 0 12px; font-size: 1.2rem; }
.about h3 { margin: 20px 0 8px; font-size: 1rem; }
.about p { margin: 0 0 10px; font-size: .95rem; }
.about ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: .93rem; }
.about li { position: relative; display: grid; grid-template-columns: 18px 1fr; gap: 8px; }
.about li::before { content: ""; width: 10px; height: 10px; margin-top: 6px; border: 2px solid var(--fg); border-right: 0; }
.about li::after { content: ""; position: absolute; left: 10px; top: 6px; width: 3px; height: 10px; background: var(--purple); }
.about .disc { margin: 16px 0 0; padding-top: 14px; border-top: 1px solid var(--line); color: var(--mut); font-size: .88rem; }
.rss { font: 600 .8rem var(--mono); color: var(--mut); }

/* Story page */
.d-hero { padding: clamp(24px, 4vw, 40px) 0 clamp(44px, 7vw, 88px); }
.back { display: inline-flex; align-items: center; gap: 10px; min-height: 40px; font-weight: 600; color: var(--mut); text-decoration: none; }
.back::before { content: ""; width: 10px; height: 18px; background: var(--purple); }
.back:hover { color: var(--fg); }
.d-top { display: grid; gap: 32px clamp(40px, 6vw, 80px); margin-top: clamp(24px, 4vw, 48px); }
@media (min-width: 821px) { .d-top { grid-template-columns: minmax(0, 1fr) auto; align-items: center; } }
.d-hero h1 { margin: 0; font-size: clamp(2.4rem, 6.2vw, 5.2rem); line-height: .96; max-width: 14ch; overflow-wrap: anywhere; }
html[lang="zh-CN"] .d-hero h1 { line-height: 1.12; }
.d-hero .dek { margin: 24px 0 0; max-width: 50ch; font-size: clamp(1.1rem, 1.8vw, 1.4rem); color: rgba(255,255,255,.9); }
.d-hero .nm { margin: 30px 0 0; font-size: 1.05rem; }
.d-hero .nm a { color: var(--fg); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.d-hero .date { margin-top: 8px; }
.framed.xl { width: clamp(150px, 24vw, 300px); border-width: clamp(10px, 1.5vw, 16px); padding: 0; margin-right: clamp(26px, 3.6vw, 44px); }
.framed.xl::after { right: calc(-1 * clamp(26px, 3.6vw, 44px)); width: clamp(26px, 3.6vw, 44px); top: calc(-1 * clamp(10px, 1.5vw, 16px)); bottom: calc(-1 * clamp(10px, 1.5vw, 16px)); }
.framed.xl:not(.photo) { padding: clamp(18px, 3vw, 36px); }
.note { border-bottom: 1px solid var(--line); }
.note .in { display: flex; gap: 14px; align-items: flex-start; padding-block: 16px; }
.note .in::before { content: ""; flex: none; width: 14px; height: 24px; background: var(--purple); }
.note p { margin: 0; max-width: 80ch; font-weight: 600; }
.st-body > * { min-width: 0; }
.st-body { display: grid; gap: 56px; padding-block: clamp(36px, 5vw, 72px) clamp(56px, 8vw, 104px); }
@media (min-width: 1000px) { .st-body { grid-template-columns: minmax(0, 1fr) 300px; gap: 72px; align-items: start; } .st-body > aside { position: sticky; top: 24px; } }
.prose { max-width: 66ch; font-size: 1.1rem; line-height: 1.72; }
html[lang="zh-CN"] .prose { line-height: 1.9; }
.prose > p { margin: 0 0 1.25em; }
.prose > p:first-child { font-size: clamp(1.22rem, 1.9vw, 1.42rem); line-height: 1.55; }
.prose > h2 { margin: 2.2em 0 .7em; font-size: clamp(1.45rem, 2.4vw, 1.8rem); line-height: 1.12; }
.prose > pre { margin: 0 0 1.25em; padding: 16px 18px; background: var(--ink); color: var(--white); border-left: 4px solid var(--purple); font: 500 .84rem/1.7 var(--mono); overflow-x: auto; }
.pq { position: relative; margin: 2em 18px 2em 0; padding: 22px 26px; border: 6px solid var(--fg); border-right: 0; }
.pq::after { content: ""; position: absolute; right: -18px; top: -6px; bottom: -6px; width: 18px; background: var(--purple); }
.pq p { margin: 0; font-size: clamp(1.35rem, 2.4vw, 1.85rem); line-height: 1.22; }
html[lang="zh-CN"] .pq p { line-height: 1.45; }
.pq footer { margin-top: 14px; color: var(--mut); font-size: .92rem; font-weight: 600; }
.fig { margin: 2em 0; }
.fig svg { display: block; width: 100%; height: auto; }
.fig figcaption { margin-top: 10px; color: var(--mut); font-size: .92rem; }
.help { position: relative; margin: 3em 14px 0 0; padding: 24px 26px; border: 2px solid var(--fg); border-right: 0; background: var(--surface); }
.help::after { content: ""; position: absolute; right: -14px; top: -2px; bottom: -2px; width: 14px; background: var(--purple); }
.help h2 { margin: 0 0 14px; font-size: 1.45rem; }
.help ol { margin: 0; padding: 0; list-style: none; counter-reset: c; display: grid; gap: 12px; }
.help li { counter-increment: c; display: grid; grid-template-columns: 2.2rem 1fr; }
.help li::before { content: counter(c, decimal-leading-zero); font: 600 .9rem var(--mono); color: var(--accent); padding-top: 3px; }
.help .reach { display: flex; flex-wrap: wrap; gap: 0 22px; align-items: center; margin: 16px 0 0; padding-top: 10px; border-top: 1px solid var(--line); }
.st-foot { display: grid; gap: 14px; margin-top: 3em; padding-top: 22px; border-top: 2px solid var(--fg); max-width: 66ch; }
.st-foot p { margin: 0; }
.byline { font-weight: 600; }
.disc { color: var(--mut); font-size: .94rem; }
.corr h3 { margin: 8px 0 6px; font-size: 1rem; }
.corr ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: .94rem; }
.corr li { display: grid; grid-template-columns: 6.6rem 1fr; gap: 10px; }
.card { position: relative; margin-right: 14px; border: 2px solid var(--fg); border-right: 0; background: var(--surface); }
.card::after { content: ""; position: absolute; right: -14px; top: -2px; bottom: -2px; width: 14px; background: var(--purple); }
.card section { padding: 20px; }
.card section + section { border-top: 1px solid var(--line); }
.card h2 { margin: 0 0 14px; font-size: 1.1rem; }
.card .row { display: flex; align-items: center; gap: 12px; }
.card .row strong { font-size: 1.05rem; line-height: 1.15; }
.card .links { display: flex; flex-wrap: wrap; gap: 0 18px; margin-top: 8px; }
.card .links span { color: var(--mut); font-weight: 600; }
.card .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; padding: 0; list-style: none; }
.card .fact { margin: 10px 0 0; font-size: .9rem; color: var(--mut); }
.card .builds { margin: 0 0 10px; color: var(--mut); font-size: .92rem; font-weight: 600; }
.more { border-top: 1px solid var(--line); padding-block: clamp(40px, 6vw, 72px); }
.more .in > div { display: grid; gap: 40px; }
@media (min-width: 900px) { .more .in > div { grid-template-columns: minmax(0, 1fr) 400px; align-items: start; } }
.more .in > div > * { min-width: 0; }
.more-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
.more h2 { margin: 0; font-size: 1.6rem; }

/* Home block */
.hb { padding: clamp(48px, 8vw, 104px) 0; border-top: 1px solid var(--line); }
.hb-h { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 28px; }
.hb-h h2 { margin: 0; font-size: clamp(2rem, 5.2vw, 4rem); line-height: 1; }
.hb-h p { margin: 10px 0 0; color: var(--mut); max-width: 56ch; }
.hb-grid { display: grid; gap: 18px; }
@media (min-width: 860px) { .hb-grid { grid-template-columns: 2fr 1fr; align-items: stretch; } }
.hcard { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 28px; min-height: 280px; padding: clamp(20px, 3vw, 32px); background: var(--ink); color: var(--white); text-decoration: none; --mut: var(--mut-d); --fg: var(--white); --accent: var(--purple-hi); transition: background .15s; }
@media (max-width: 560px) { .hcard { grid-template-columns: 1fr; } }
.hcard:hover, .hcard:focus-visible { background: var(--purple); --mut: rgba(255,255,255,.82); }
.hcard:hover .framed::after, .hcard:focus-visible .framed::after { background: var(--white); }
.hcard strong { display: block; margin-top: 8px; font-size: clamp(1.5rem, 2.8vw, 2.3rem); line-height: 1.02; max-width: 20ch; }
html[lang="zh-CN"] .hcard strong { line-height: 1.2; }
.hcard .dek { margin: 12px 0 0; color: var(--mut); max-width: 54ch; }
.hcard .date { margin-top: 14px; }
.hb-grid .empty-slot { min-height: 280px; }

/* Project page badge */
.p-hero { padding: clamp(24px, 4vw, 40px) 0 clamp(40px, 7vw, 80px); }
.p-top { margin-top: clamp(20px, 4vw, 44px); display: grid; gap: 28px clamp(28px, 5vw, 64px); }
@media (min-width: 721px) { .p-top { grid-template-columns: auto minmax(0, 1fr); align-items: start; } }
.p-top h1 { margin: 0; font-size: clamp(2.4rem, 7.4vw, 6rem); line-height: .94; }
.p-top .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; padding: 0; list-style: none; }
.p-top .tag { margin: 22px 0 0; max-width: 60ch; font-size: clamp(1.05rem, 1.6vw, 1.3rem); }
.p-top .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; margin-top: 28px; }
.p-top .line { margin: 24px 0 0; color: var(--mut); }
.sbadge { position: relative; display: inline-grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 14px; margin: 28px 24px 0 0; padding: 12px 20px 12px 14px; max-width: 52ch; border: 2px solid var(--fg); border-right: 0; text-decoration: none; }
.sbadge::after { content: ""; position: absolute; right: -14px; top: -2px; bottom: -2px; width: 14px; background: var(--purple); transition: width .18s, right .18s; }
.sbadge:hover::after, .sbadge:focus-visible::after { width: 24px; right: -24px; }
.sbadge small { display: block; color: var(--mut); font-weight: 600; font-size: .88rem; }

let lang = "en", count = "many", homeState = "with", headline = "a", current = STORIES[0].slug;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const L = (x, l = lang) => (typeof x === "string" ? x : x[l] || x.en);
const byDate = [...STORIES].sort((a, b) => b.published.localeCompare(a.published));
const content = (s, l = lang) => (l === "zh" && s.zh) || s.en;
const isFallback = (s) => lang === "zh" && !s.zh;
const minutes = (s) => s.mockMin; // the real site: 220 words/min (en), 400 characters/min (zh)

function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } h ^= h >>> 13; h = Math.imul(h, 1274126177); h ^= h >>> 16; return h >>> 0; }
function pop(x) { let n = 0; for (let i = 0; i < 15; i++) n += (x >> i) & 1; return n; }
function icon(slug) {
  let h = hash(slug), salt = 0;
  while (pop(h & 32767) < 7 || pop(h & 32767) > 11) { salt++; h = hash(slug + salt); }
  let r = "";
  for (let y = 0; y < 5; y++) for (let x = 0; x < 3; x++) if ((h >> (y * 3 + x)) & 1) { r += `<rect x="${x + 0.06}" y="${y + 0.06}" width=".88" height=".88"/>`; if (x < 2) r += `<rect x="${4 - x + 0.06}" y="${y + 0.06}" width=".88" height=".88"/>`; }
  return `<svg viewBox="0 0 5 5" fill="currentColor" aria-hidden="true">${r}</svg>`;
}
const person = (s, size = "") => `<div class="framed ${size}${s.person.avatar ? " photo" : ""}">${s.person.avatar ? AVATARS[s.person.avatar] : icon(s.person.name)}</div>`;
const issueNo = (s) => [...byDate].reverse().indexOf(s) + 1;
const pad = (n) => String(n).padStart(2, "0");
// Generated cover: the issue number in the slot. Same for every story, no photo needed.

const who = (s, link) => `<div class="whorow">${person(s, "sm")}${nm(s, link)}</div>`;
const kick = (s) => `<p class="kick mono">${t("kick", { n: pad(issueNo(s)) })}</p>`;
const proj = (slug, size = "") => `<div class="framed ${size}">${icon(slug)}</div>`;
const ext = (href, label, cls = "lnk") => `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener">${label}</a>`;
const nm = (s, link) => `<span class="nm">${esc(s.person.name)}<i>//</i>${link ? `<a href="#project">${esc(PROJECTS[s.project].name)}</a>` : `<span>${esc(PROJECTS[s.project].name)}</span>`}</span>`;
const dateLine = (s) => `<p class="date mono">${s.published} · ${t("min", { n: minutes(s) })}</p>`;
const LINKS = { github: ["GitHub", "https://github.com/"], x: ["X", "https://x.com/"], telegram: ["Telegram", "https://t.me/"] };
const personLinks = (s) => Object.entries(s.person.links || {}).map(([k, v]) => ext(LINKS[k][1] + v, LINKS[k][0])).join("");
const emptySlot = () => `<div class="empty-slot"><strong class="semi">${t("slot_h")}</strong><p>${t("slot_p")}</p>
    <div class="acts">${ext(SHARE, t("slot_issue"))}${ext(TALK_DM, t("slot_talk"))}</div><span>${t("reply")}</span></div>`;
const pastList = (list) => `<ul class="past">${list.map((s) => { const c = content(s); return `<li><a href="#story" data-open="${s.slug}">${cover(s, "sm")}
    <span>${nm(s)}<strong class="semi">${esc(c.title)}</strong><span class="dk">${esc(c.dek)}</span><span class="date mono">${s.published}</span></span></a></li>`; }).join("")}</ul>`;
const previewBar = (label, items) => `<div class="on-dark" style="border-bottom:1px solid var(--line-d)"><div class="in preview" role="group" aria-label="Preview"><span>${label}</span>${items}</div></div>`;
const pbtn = (attr, val, on, label) => `<button type="button" data-${attr}="${val}" aria-pressed="${on}">${label}</button>`;

function block([k, v, cap], s) {
  if (k === "p") return `<p>${esc(v)}</p>`;
  if (k === "h") return `<h2 class="semi">${esc(v)}</h2>`;
  if (k === "q") return `<blockquote class="pq"><p class="semi">${esc(v)}</p><footer>${esc(s.person.name)}</footer></blockquote>`;
  if (k === "code") return `<pre><code>${esc(v)}</code></pre>`;
  if (k === "img") return `<figure class="fig">${FIG[v]}<figcaption>${esc(cap)}</figcaption></figure>`;
  return "";
}

          ${s.help ? `<section class="help" aria-labelledby="help-h"><h2 class="semi" id="help-h">${t("help_h", { n })}</h2>
            <ol>${s.help.map((h) => `<li>${esc(L(h))}</li>`).join("")}</ol>

          <footer class="st-foot">

function md(body) {
  return body.map(([k, v, cap]) => k === "h" ? "## " + v : k === "q" ? "> " + v : k === "img" ? `![${cap}](./${v === "sync" ? "shot-1" : "photo-1"}.webp)` : k === "code" ? "```\n" + v + "\n```" : v).join("\n\n");
}
function sourcePanel(s) {
  const y = (x) => JSON.stringify(x);
  const fm = ["---", `title: ${y(s.en.title)}`, `dek: ${y(s.en.dek)}`, `project: ${s.project}`, "person:", `  name: ${s.person.name}`, ...(s.person.avatar ? ["  avatar: avatar.webp"] : []),
    ...(s.person.links ? ["  links:", ...Object.entries(s.person.links).map(([k, v]) => `    ${k}: ${v}`)] : []),
    ...(s.voice !== "narrative" ? [`voice: ${s.voice}`] : []), `author: ${s.author}`, `published: ${s.published}`,
    ...(s.help ? ["help:", ...s.help.map((h) => `  - ${y(h.en)}`)] : []),
    ...(s.disclosure ? [`disclosure: ${y(s.disclosure.en)}`] : []), ...(s.talk ? [`talk: ${s.talk}`] : []),
    ...(s.corrections ? ["corrections:", ...s.corrections.flatMap((x) => [`  - date: ${x.date}`, `    note: ${y(x.note.en)}`])] : []), "---", ""].join("\n");
  const zh = s.zh ? ["---", `title: ${y(s.zh.title)}`, `dek: ${y(s.zh.dek)}`, "---", "", md(s.zh.body)].join("\n") : "(none: /zh shows the English text)";
  return `<details class="draftsrc"><summary class="in">${t("src")}</summary><div class="in cols">
      <div><h3>content/stories/${s.slug}/en.md</h3><pre>${esc(fm + md(s.en.body))}</pre></div>
      <div><h3>content/stories/${s.slug}/zh.md</h3><pre>${esc(zh)}</pre></div>
    </div></details>`;
}

      <figure>${ogCard(STORIES[0], "zh")}<figcaption>${t("og_b")} · /zh/stories/${STORIES[0].slug}/opengraph-image</figcaption></figure>
      <figure>${ogCard(STORIES[1], "en")}<figcaption>${t("og_c")} · /en/stories/${STORIES[1].slug}/opengraph-image</figcaption></figure>
    </div></section>`;
}

function render() {
  const view = (location.hash || "#stories").slice(1);
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.getElementById("draftNote").textContent = t("draft");
  document.getElementById("vLabel").textContent = t("views");
  document.querySelectorAll(".views a").forEach((a) => { a.textContent = t("v_" + a.dataset.v); a.removeAttribute("aria-current"); if (a.dataset.v === view) a.setAttribute("aria-current", "page"); });
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === lang));
  const active = view === "stories" || view === "story" ? 2 : view === "home" ? 0 : view === "project" ? 1 : -1;
  document.getElementById("nav").innerHTML = T[lang].nav.map((n, i) => `<a href="${i === 2 ? "#stories" : i === 0 ? "#home" : "#"}"${i === active ? ' aria-current="page"' : ""}>${n}</a>`).join("");
  document.getElementById("foot").innerHTML = `<span>${t("foot")}</span><a href="${REPO}" target="_blank" rel="noopener" style="color:#fff">${REPO.replace("https://", "")}</a>`;
  const views = { story: storyView, home: homeView, project: projectView, og: ogView };
  document.getElementById("app").innerHTML = (views[view] || storiesView)();
}

document.addEventListener("click", (e) => {
  const o = e.target.closest("[data-open]");
  if (o) { current = o.dataset.open; if (location.hash === "#story") { e.preventDefault(); render(); scrollTo(0, 0); } return; }
  const pk = e.target.closest("[data-pick]"); if (pk) { current = pk.dataset.pick; render(); return; }
  const c = e.target.closest("[data-count]"); if (c) { count = c.dataset.count; render(); return; }
  const hd = e.target.closest("[data-head]"); if (hd) { headline = hd.dataset.head; render(); return; }
  const h = e.target.closest("[data-home]"); if (h) { homeState = h.dataset.home; render(); return; }
  const l = e.target.closest("[data-l]"); if (l) { lang = l.dataset.l; render(); }
});
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
render();
</script>
</body>
</html>
