# Refreshes src/data/github-signals.json once a day. The site build never calls GitHub:
# a commit here is what triggers the Netlify deploy.
name: github-signals
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm snapshot:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          # fetchedAt changes every run; only commit when a signal actually changed
          if git diff --quiet -I'"fetchedAt"' -- src/data/github-signals.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-signals.json
          git commit -m "chore: refresh GitHub signals"
          git push
