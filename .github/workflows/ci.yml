name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly external link check (CLAUDE.md: not on every PR).
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate content
        run: pnpm validate:content
      - name: Lint
        run: pnpm lint
      # PageProps/LayoutProps and next-env.d.ts come from `next typegen`; a fresh checkout has neither.
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

      # `pnpm build` validates content again (cheap) and then runs next build.
      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Smoke tests plus the UI quality gate (tests/e2e/quality.spec.ts: console errors,
      # horizontal scroll, axe serious/critical, visible focus, one h1) against the build.
      - name: E2E
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check external links
        run: pnpm check:links
